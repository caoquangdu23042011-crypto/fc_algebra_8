        let audioCtx = null;
        const playSound = (type) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                const masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                
                const createOsc = (type, freq, time, duration, vol) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(vol, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(time);
                    osc.stop(time + duration);
                    return osc;
                };

                if (type === 'correct') {
                    masterGain.gain.value = 0.6; 
                    createOsc('sine', 523.25, now, 0.3, 0.5); 
                    createOsc('sine', 659.25, now + 0.1, 0.3, 0.5); 
                    createOsc('triangle', 783.99, now + 0.2, 0.4, 0.6); 
                } else if (type === 'wrong') {
                    masterGain.gain.value = 0.6;
                    createOsc('sawtooth', 300, now, 0.3, 0.4);
                    createOsc('sawtooth', 250, now + 0.15, 0.4, 0.4);
                } else if (type === 'whistle') {
                    masterGain.gain.value = 0.8;
                    createOsc('square', 1200, now, 0.2, 0.8);
                    createOsc('square', 1250, now, 0.2, 0.8);
                    createOsc('square', 1200, now + 0.3, 0.4, 0.8);
                    createOsc('square', 1250, now + 0.3, 0.4, 0.8);
                } else if (type === 'click') {
                    masterGain.gain.value = 0.3;
                    createOsc('sine', 800, now, 0.05, 0.2);
                } else if (type === 'win') {
                    masterGain.gain.value = 0.8;
                    const chords = [[440, 554.37, 659.25], [493.88, 622.25, 739.99], [523.25, 659.25, 783.99, 1046.50]];
                    chords[0].forEach(f => createOsc('square', f, now, 0.2, 0.2));
                    chords[1].forEach(f => createOsc('square', f, now + 0.2, 0.2, 0.2));
                    chords[2].forEach(f => createOsc('square', f, now + 0.4, 1.0, 0.3));
                }

                                    />
                                ) : (
                                    <svg viewBox="0 0 100 100" fill="currentColor" className="w-[120px] h-[120px] text-white/90 opacity-90">
                                        <path d="M50 10 C35 10, 25 25, 28 40 C30 50, 40 55, 50 55 C60 55, 70 50, 72 40 C75 25, 65 10, 50 10 Z" />
                                        <path d="M20 90 C20 70, 30 60, 50 60 C70 60, 80 70, 80 90 L80 100 L20 100 Z" />
                                    </svg>
                                )}
                            </div>

                            <div className="mt-auto mb-1 z-20 bg-gradient-to-t from-black/80 via-black/40 to-transparent pt-6 pb-2 px-1 -mx-3 rounded-b-lg">
                                <h3 className="text-center font-black text-lg uppercase tracking-wider drop-shadow-lg mb-2">{player.name}</h3>
                                <div className="grid grid-cols-2 gap-x-2 gap-y-0.5 px-2 text-[10px] font-bold">
                                    {statLabels.map((label, idx) => (
                                        <div key={idx} className="flex justify-between items-center border-b border-white/10 pb-[1px]">
                                            <span className="opacity-80 text-[9px]">{label}</span>
                                            <span className="text-[12px]">{statValues[idx]}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('home'); 
            const [unlockedCards, setUnlockedCards] = useState([]);
            const [soundEnabled, setSoundEnabled] = useState(true);
            
            const [questionBank, setQuestionBank] = useState(() => {
                try {
                    const saved = localStorage.getItem('fc_algebra_questions_v2');
                    return saved ? JSON.parse(saved) : DEFAULT_QUESTIONS;
                } catch (e) { return DEFAULT_QUESTIONS; }
            });

            const [dailyQuiz, setDailyQuiz] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswerChecked, setIsAnswerChecked] = useState(false);
            const [newCardWon, setNewCardWon] = useState(null);
            
            const [revealStep, setRevealStep] = useState(0); 
            const [awardedPlayerTemp, setAwardedPlayerTemp] = useState(null);

            const [activeCheer, setActiveCheer] = useState(null);
            const [cheatCount, setCheatCount] = useState(0);
            const [showYellowCard, setShowYellowCard] = useState(false);
            const [isRedCarded, setIsRedCarded] = useState(false);

            const [devInput, setDevInput] = useState('');
            const [isDevAuth, setIsDevAuth] = useState(false);
            const [devTab, setDevTab] = useState('questions');
            const [newQ, setNewQ] = useState({ text: '', opt0: '', opt1: '', opt2: '', opt3: '', correct: 0 });

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('fc_algebra_pro_cards_v2');
                    if (saved) setUnlockedCards(JSON.parse(saved));
                } catch (e) { console.error(e); }
            }, []);

            useEffect(() => {
                localStorage.setItem('fc_algebra_pro_cards_v2', JSON.stringify(unlockedCards));
            }, [unlockedCards]);

            useEffect(() => {
                localStorage.setItem('fc_algebra_questions_v2', JSON.stringify(questionBank));
            }, [questionBank]);

            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && screen === 'quiz' && !isRedCarded) {
                        setCheatCount(prev => {
                            const newCount = prev + 1;
                            if (newCount === 1) {
                                soundPlay('whistle');
                                setShowYellowCard(true);
                                setTimeout(() => setShowYellowCard(false), 3000);
                            } else if (newCount >= 2) {
                                soundPlay('whistle');
                                setIsRedCarded(true);
                                setTimeout(() => {
                                    setScore(0);
                                    setScreen('result');
                                }, 2000);
                            }
                            return newCount;
                        });
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [screen, isRedCarded]);

            const soundPlay = (type) => {
                if (soundEnabled) playSound(type);
            };

            const startDailyQuiz = () => {
                const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
                setDailyQuiz(shuffled.slice(0, 10));
                setCurrentIndex(0);
                setScore(0);
                setSelectedOption(null);
                setIsAnswerChecked(false);
                setNewCardWon(null);
                setRevealStep(0);
                setAwardedPlayerTemp(null);
                setCheatCount(0);
                setIsRedCarded(false);
                setShowYellowCard(false);
                setActiveCheer(null);
                setScreen('quiz');
            };

            const handleCheckAnswer = () => {
                if (selectedOption === null) return;
                const isCorrect = selectedOption === dailyQuiz[currentIndex].correct;
                if (isCorrect) {
                    soundPlay('correct');
                    setScore(prev => prev + 1);
                    const randomCheer = CHEER_MESSAGES[Math.floor(Math.random() * CHEER_MESSAGES.length)];
                    setActiveCheer(randomCheer);
                } else {
                    soundPlay('wrong');
                    setActiveCheer(null);
                }
                setIsAnswerChecked(true);
            };

            const handleNextQuestion = () => {
                if (currentIndex < dailyQuiz.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setIsAnswerChecked(false);
                    setActiveCheer(null);
                } else {
                    finishQuiz();
                }
            };

            const finishQuiz = () => {
                const finalScore = score + (selectedOption === dailyQuiz[currentIndex].correct ? 1 : 0);
                if (finalScore >= 8 && !isRedCarded) {
                    soundPlay('win');
                    prepareAwardCard();
                }
                setScreen('result');
            };

            const prepareAwardCard = () => {
                const lockedCards = PLAYERS.filter(p => !unlockedCards.includes(p.id));
                let chosen;
                let isDup = false;
                if (lockedCards.length > 0) {
                    chosen = lockedCards[Math.floor(Math.random() * lockedCards.length)];
                } else {
                    chosen = PLAYERS[Math.floor(Math.random() * PLAYERS.length)];
                    isDup = true;
                }
                setAwardedPlayerTemp({ ...chosen, duplicate: isDup });
                setRevealStep(1);
            };

            const handleNextRevealStep = () => {
                soundPlay('click');
                if (revealStep < 4) {
                    setRevealStep(prev => prev + 1);
                } else {
                    if (awardedPlayerTemp) {
                        if (!awardedPlayerTemp.duplicate && !unlockedCards.includes(awardedPlayerTemp.id)) {
                            setUnlockedCards(prev => [...prev, awardedPlayerTemp.id]);
                        }
                        setNewCardWon(awardedPlayerTemp);
                    }
                    setRevealStep(5);
                }
            };

            const handleDevLogin = (e) => {
                e.preventDefault();
                if (devInput === 'FC VIET NAM') {
                    setIsDevAuth(true);
                    setScreen('dev_dashboard');
                    setDevInput('');
                } else {
                    alert('Mã code không chính xác!');
                }
            };

            const handleAddQuestion = (e) => {
                e.preventDefault();
                if (!newQ.text || !newQ.opt0 || !newQ.opt1 || !newQ.opt2 || !newQ.opt3) {
                    alert('Vui lòng điền đủ thông tin câu hỏi!');
                    return;
                }
                const newQuestionObj = {
                    id: Date.now(),
                    text: newQ.text,
                    options: [newQ.opt0, newQ.opt1, newQ.opt2, newQ.opt3],
                    correct: Number(newQ.correct)
                };
                setQuestionBank(prev => [newQuestionObj, ...prev]);
                setNewQ({ text: '', opt0: '', opt1: '', opt2: '', opt3: '', correct: 0 });
                alert('Thêm đề thành công!');
            };

            const handleDeleteQuestion = (id) => {
                if(confirm('Bạn có chắc muốn xóa câu này?')) {
                    setQuestionBank(prev => prev.filter(q => q.id !== id));
                }
            };

            return (
                <div className="flex flex-col relative w-full min-h-screen">
                    <style>{`
                        @keyframes sweep { 0% { transform: translateX(-150%) skewX(-12deg); } 100% { transform: translateX(150%) skewX(-12deg); } }
                        .animate-sweep { animation: sweep 1.5s infinite; }
                        @keyframes cardReveal { 0% { transform: scale(0.2) translateY(-300px) rotate(-15deg) rotateY(180deg); opacity: 0; filter: brightness(3); } 50% { transform: scale(1.2) translateY(50px) rotate(5deg) rotateY(90deg); filter: brightness(1.5); } 100% { transform: scale(1) translateY(0) rotate(0) rotateY(0); opacity: 1; filter: brightness(1); } }
                        .animate-card-reveal { animation: cardReveal 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
                        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
                        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
                        .animate-shake { animation: shake 0.3s ease-in-out; }
                        @keyframes popCheer { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
                        .animate-pop-cheer { animation: popCheer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
                        @keyframes slideDownRedCard { 0% { transform: translateY(-100vh) rotate(45deg); } 70% { transform: translateY(50px) rotate(-10deg); } 100% { transform: translateY(0) rotate(0deg); } }
                        .animate-red-card { animation: slideDownRedCard 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
                        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
                        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
                        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
                        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
                    `}</style>

                    <header className="p-4 flex justify-between items-center bg-slate-900 border-b border-slate-800 shadow-[0_4px_20px_rgba(0,0,0,0.5)] z-20 relative">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-cyan-400 to-blue-600 p-2 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                                <Shield size={26} className="text-slate-950 fill-white" />
                            </div>
                            <h1 className="font-black text-2xl tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-400 drop-shadow-md hidden sm:block">
                                FC ALGEBRA <span className="text-yellow-400">8</span>
                            </h1>
                        </div>
                        <div className="flex items-center gap-2 sm:gap-4">
                            {screen !== 'quiz' && (
                                <button onClick={() => setScreen('dev_login')} className="text-slate-600 hover:text-cyan-400 transition" title="Nhà phát triển">
                                    <Settings size={20} />
                                </button>
                            )}
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="text-cyan-400 hover:text-white transition">
                                {soundEnabled ? <Volume2 size={24} /> : <VolumeX size={24} />}
                            </button>
                            {screen !== 'quiz' && (
                                <div className="flex items-center gap-2 bg-slate-950 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-slate-800 shadow-inner cursor-pointer hover:bg-slate-800" onClick={() => setScreen('collection')}>
                                    <Trophy size={18} className="text-yellow-400" />
                                    <span className="font-black text-sm sm:text-base text-yellow-100">{unlockedCards.length} / {PLAYERS.length}</span>
                                </div>
                            )}
                        </div>
                    </header>

                    {showYellowCard && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm animate-fade-in pointer-events-none">
                            <div className="bg-yellow-400 w-64 h-80 rounded-lg shadow-[0_0_50px_rgba(250,204,21,0.5)] flex flex-col items-center justify-center transform rotate-6 border-4 border-yellow-200">
                                <Shield size={64} className="text-yellow-700 mb-4" />
                                <h2 className="text-3xl font-black text-yellow-900 uppercase">CẢNH CÁO!</h2>
                                <p className="text-yellow-800 font-bold mt-2 text-center px-4">Thoát ứng dụng lần 1.<br/>Tập trung vào trận đấu!</p>
                            </div>
                        </div>
                    )}
                    {isRedCarded && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md">
                            <div className="bg-red-600 w-72 h-96 rounded-lg shadow-[0_0_100px_rgba(220,38,38,0.8)] flex flex-col items-center justify-center animate-red-card border-4 border-red-400">
                                <XCircle size={80} className="text-white mb-6" />
                                <h2 className="text-5xl font-black text-white uppercase tracking-widest">THẺ ĐỎ</h2>
                                <p className="text-white font-bold mt-4 text-center px-4 text-lg">Phát hiện gian lận lần 2.<br/>Hủy bỏ kết quả thi!</p>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 flex flex-col max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8 relative z-10">
                        {/* Màn hình chính */}
                        {screen === 'home' && (
                            <div className="flex-1 flex flex-col items-center justify-center text-center space-y-10 animate-fade-in py-12">
                                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 -z-10 pointer-events-none"></div>
                                <div className="space-y-4">
                                    <h2 className="text-5xl sm:text-7xl font-black text-white tracking-tight drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                                        CHINH PHỤC <br/>
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-500">ĐẠI SỐ</span>
                                    </h2>
                                    <p className="text-slate-400 max-w-lg mx-auto text-lg font-medium">
                                        Vượt qua 10 câu Đại số lớp 8. Đạt <span className="text-green-400 font-bold">80%</span> để mở khóa các siêu sao thế giới và ĐTVN! <br/>
                                        <span className="text-red-400 text-sm italic">⚠️ Chế độ Fair-play: Không có nút thoát giữa trận & VAR kiểm tra gian lận!</span>
                                    </p>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-6 w-full max-w-lg mt-8">
                                    <button onClick={startDailyQuiz} className="group flex-1 flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black py-4 px-6 rounded-2xl shadow-[0_0_30px_rgba(6,182,212,0.3)] transition-all hover:scale-105 active:scale-95 text-xl border-t border-white/20">
                                        <Zap size={24} className="fill-white group-hover:animate-pulse" /> KICK-OFF TRẬN ĐẤU
                                    </button>
                                    <button onClick={() => setScreen('collection')} className="flex-1 flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all hover:scale-105 active:scale-95 text-xl border border-slate-700">
                                        <Swords size={24} /> ĐỘI HÌNH CỦA TÔI
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Màn hình làm bài thi */}
                        {screen === 'quiz' && dailyQuiz.length > 0 && !isRedCarded && (
                            <div className="flex-1 flex flex-col max-w-3xl w-full mx-auto animate-fade-in">
                                <div className="flex items-center gap-4 mb-10">
                                    <div className="flex-1 h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800 shadow-inner">
                                        <div 
                                            className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(6,182,212,0.8)]"
                                            style={{ width: `${(currentIndex / dailyQuiz.length) * 100}%` }}
                                        ></div>
                                    </div>
                                    <div className="font-black text-cyan-400 text-xl font-mono">{currentIndex + 1}<span className="text-slate-600">/10</span></div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] mb-8 relative">
                                    {activeCheer && (
                                        <div className="absolute -top-12 -right-4 sm:-right-12 z-20 animate-pop-cheer flex flex-col items-center">
                                            <span className="text-5xl sm:text-7xl filter drop-shadow-[0_5px_15px_rgba(250,204,21,0.5)]">{activeCheer.icon}</span>
                                            <span className="bg-yellow-400 text-yellow-900 font-black px-3 py-1 rounded-full text-xs sm:text-sm shadow-lg mt-2 uppercase border border-yellow-200">
                                                {activeCheer.text}
                                            </span>
                                        </div>
                                    )}
                                    <h2 className="text-2xl sm:text-3xl font-black text-white leading-relaxed">
                                        {dailyQuiz[currentIndex].text}
                                    </h2>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-auto">
                                    {dailyQuiz[currentIndex].options.map((opt, idx) => {
                                        const isSelected = selectedOption === idx;
                                        const isCorrect = idx === dailyQuiz[currentIndex].correct;
                                        let btnStyle = "bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800";
                                        let animationStyle = "";

                                        if (isAnswerChecked) {
                                            if (isCorrect) btnStyle = "bg-green-900/40 border-green-500 text-green-300 shadow-[0_0_15px_rgba(34,197,94,0.3)]";
                                            else if (isSelected && !isCorrect) { btnStyle = "bg-red-900/40 border-red-500 text-red-300 shadow-[0_0_15px_rgba(239,68,68,0.3)]"; animationStyle = "animate-shake"; }
                                            else btnStyle = "bg-slate-900 border-slate-800 text-slate-600 opacity-50"; 
                                        } else if (isSelected) {
                                            btnStyle = "bg-cyan-900/40 border-cyan-400 text-cyan-300 shadow-[0_0_20px_rgba(6,182,212,0.4)] scale-[1.02]";
                                        }

                                        return (
                                            <button key={idx} disabled={isAnswerChecked} onClick={() => setSelectedOption(idx)} className={`text-center p-5 rounded-2xl border-2 font-bold text-xl transition-all duration-200 ${btnStyle} ${animationStyle}`}>
                                                {opt}
                                            </button>
                                        )
                                    })}
                                </div>

                                <div className="mt-8 h-24 flex items-center pb-8">
                                    {!isAnswerChecked ? (
                                        <button disabled={selectedOption === null} onClick={handleCheckAnswer} className={`w-full py-4 rounded-2xl font-black text-xl transition-all ${selectedOption !== null ? 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-[0_0_20px_rgba(6,182,212,0.5)] hover:scale-[1.02]' : 'bg-slate-900 text-slate-600 cursor-not-allowed border border-slate-800'}`}>
                                            CHỐT ĐÁP ÁN
                                        </button>
                                    ) : (
                                        <div className={`w-full flex items-center justify-between p-4 sm:p-6 rounded-2xl border-2 ${selectedOption === dailyQuiz[currentIndex].correct ? 'bg-green-950 border-green-500/50' : 'bg-red-950 border-red-500/50'}`}>
                                            <div className="flex items-center gap-4">
                                                {selectedOption === dailyQuiz[currentIndex].correct ? <CheckCircle size={40} className="text-green-400" /> : <XCircle size={40} className="text-red-400" />}
                                                <div className={`font-black text-xl sm:text-2xl ${selectedOption === dailyQuiz[currentIndex].correct ? 'text-green-400' : 'text-red-400'}`}>
                                                    {selectedOption === dailyQuiz[currentIndex].correct ? 'TUYỆT ĐỈNH!' : 'SAI MẤT RỒI!'}
                                                </div>
                                            </div>
                                            <button onClick={handleNextQuestion} className={`px-8 py-3 rounded-xl font-bold text-lg text-white transition-all hover:scale-105 shadow-lg ${selectedOption === dailyQuiz[currentIndex].correct ? 'bg-green-600 hover:bg-green-500' : 'bg-red-600 hover:bg-red-500'}`}>
                                                {currentIndex === dailyQuiz.length - 1 ? 'KẾT THÚC TRẬN' : 'TIẾP TỤC ➔'}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Màn hình tổng kết và nhận quà */}
                        {screen === 'result' && (
                            <div className="flex-1 flex flex-col items-center justify-center text-center w-full relative py-8">
                                {score >= 8 && !isRedCarded && (
                                    <div className="absolute inset-0 flex items-center justify-center -z-10 overflow-hidden pointer-events-none">
                                        <div className="w-[500px] h-[500px] bg-cyan-500/20 rounded-full blur-[100px] animate-pulse"></div>
                                    </div>
                                )}
                                
                                <div className="space-y-4 mb-6">
                                    <h2 className="text-3xl sm:text-4xl font-black text-white uppercase tracking-wider">{isRedCarded ? "Truất quyền thi đấu" : "Tổng Kết Trận Đấu"}</h2>
                                    <div className={`text-5xl sm:text-6xl font-black ${isRedCarded ? 'text-red-600' : (score >= 8 ? 'text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-500 drop-shadow-[0_0_15px_rgba(74,222,128,0.5)]' : 'text-red-400')}`}>
                                        {score} <span className="text-3xl text-slate-500">/ 10</span>
                                    </div>
                                </div>

                                {isRedCarded ? (
                                    <div className="bg-red-950/80 border-2 border-red-500 text-red-200 font-bold p-6 rounded-2xl max-w-md animate-fade-in flex flex-col items-center">
                                        <Shield size={48} className="text-red-500 mb-4" />
                                        Cậu đã nhận thẻ đỏ vì thoát ứng dụng giữa trận. Kết quả bị hủy. 
                                    </div>
                                ) : score >= 8 ? (
                                    <div className="flex flex-col items-center w-full max-w-lg">
                                        {revealStep < 5 && awardedPlayerTemp && (
                                            <div className="bg-slate-900 border-2 border-cyan-500/50 p-6 rounded-3xl shadow-[0_0_30px_rgba(6,182,212,0.3)] w-full animate-fade-in my-4">
                                                <div className="flex items-center justify-center gap-2 text-cyan-400 font-bold text-sm uppercase mb-4">
                                                    <HelpCircle size={20} /> Mini-game: Đoán cầu thủ bí ẩn ({revealStep}/4)
                                                </div>

                                                <div className="space-y-3 mb-6 min-h-[140px] flex flex-col justify-center">
                                                    <div className={`p-3 rounded-xl border transition-all ${revealStep >= 1 ? 'bg-slate-950 border-cyan-500/60 text-white font-bold' : 'bg-slate-950/40 border-slate-800 text-slate-600'}`}>
                                                        {revealStep >= 1 ? `✨ Mùa thẻ / Tier: ${awardedPlayerTemp.tier}` : '❓ Đang ẩn Mùa thẻ...'}
                                                    </div>
                                                    <div className={`p-3 rounded-xl border transition-all ${revealStep >= 2 ? 'bg-slate-950 border-cyan-500/60 text-white font-bold' : 'bg-slate-950/40 border-slate-800 text-slate-600'}`}>
                                                        {revealStep >= 2 ? `🛡️ Vị trí thi đấu: ${awardedPlayerTemp.pos}` : '❓ Đang ẩn Vị trí...'}
                                                    </div>
                                                    <div className={`p-3 rounded-xl border transition-all ${revealStep >= 3 ? 'bg-slate-950 border-cyan-500/60 text-white font-bold' : 'bg-slate-950/40 border-slate-800 text-slate-600'}`}>
                                                        {revealStep >= 3 ? `🌍 Quốc gia: ${awardedPlayerTemp.nation} (${awardedPlayerTemp.club})` : '❓ Đang ẩn Quốc gia & CLB...'}
                                                    </div>
                                                    <div className={`p-3 rounded-xl border transition-all ${revealStep >= 4 ? 'bg-slate-950 border-yellow-500/60 text-yellow-300 font-bold text-sm' : 'bg-slate-950/40 border-slate-800 text-slate-600'}`}>
                                                        {revealStep >= 4 ? `🎉 Gợi ý kỷ lục: "${awardedPlayerTemp.record}"` : '❓ Đang ẩn Kỷ lục đặc biệt...'}
                                                    </div>
                                                </div>

                                                <button 
                                                    onClick={handleNextRevealStep}
                                                    className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3 px-6 rounded-xl shadow-lg transition transform hover:scale-[1.02]"
                                                >
                                                    {revealStep < 4 ? 'LẬT TIẾP GỢI Ý ➔' : 'MỞ KHÓA THẺ NGAY! 🎁'}
                                                </button>
                                            </div>
                                        )}

                                        {revealStep === 5 && newCardWon && (
                                            <div className="flex flex-col items-center animate-fade-in my-2">
                                                <div className="text-yellow-400 font-bold text-sm px-4 py-1.5 bg-yellow-950/50 rounded-full border border-yellow-500/30 mb-4">
                                                    🎉 BẠN ĐÃ MỞ KHÓA THÀNH CÔNG!
                                                </div>
                                                <PlayerCard player={newCardWon} isNew={true} />
                                                {newCardWon.duplicate && (
                                                    <div className="text-amber-400 font-bold text-sm bg-black/50 px-3 py-1 rounded-full mt-3">
                                                        (Thẻ đã có trong Đội hình)
                                                    </div>
                                                )}
                                                <div className="mt-4 text-xs text-slate-400 max-w-xs text-center">
                                                    <span className="text-cyan-400 font-bold">Kiểu ăn mừng:</span> {newCardWon.celebration}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-slate-900 border border-slate-700 text-slate-300 font-bold p-6 rounded-2xl max-w-md animate-fade-in my-6">
                                        Cần đạt ít nhất 8/10 (80%) để nhận thẻ cầu thủ. <br/> Đừng nản chí, làm lại trận mới nào!
                                    </div>
                                )}

                                <div className="flex gap-4 mt-6 animate-fade-in">
                                    <button onClick={() => setScreen('home')} className="bg-slate-900 border border-slate-700 hover:bg-slate-800 hover:border-slate-500 text-white font-bold py-3 px-8 rounded-xl transition-all">
                                        <Home size={20} className="inline mr-2" /> TRANG CHỦ
                                    </button>
                                    <button onClick={startDailyQuiz} className="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                                        <Play size={20} className="inline mr-2 fill-white" /> ĐÁ TRẬN MỚI
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Màn hình bộ sưu tập */}
                        {screen === 'collection' && (
                            <div className="flex-1 flex flex-col animate-fade-in pb-12">
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-10 border-b border-slate-800 pb-6">
                                    <div className="flex items-center gap-4 w-full sm:w-auto">
                                        <button onClick={() => setScreen('home')} className="bg-slate-900 border border-slate-800 p-3 rounded-xl hover:bg-slate-800 transition">
                                            <ArrowRight size={24} className="transform rotate-180 text-cyan-400" />
                                        </button>
                                        <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">ĐỘI HÌNH CỦA TÔI</h2>
                                    </div>
                                    <div className="bg-slate-900 px-6 py-3 rounded-2xl border border-slate-700 font-black text-lg shadow-inner w-full sm:w-auto text-center">
                                        SỞ HỮU: <span className="text-cyan-400">{unlockedCards.length}</span> <span className="text-slate-500">/ {PLAYERS.length}</span>
                                    </div>
                                </div>
                                <div className="flex flex-wrap justify-center gap-6 sm:gap-8">
                                    {PLAYERS.map((player, index) => {
                                        const isUnlocked = unlockedCards.includes(player.id);
                                        return (
                                            <div key={player.id} className="flex flex-col items-center">
                                                {isUnlocked ? <PlayerCard player={player} delay={index * 50} /> : (
                                                    <div className="w-[220px] h-[340px] bg-slate-900 rounded-lg border-2 border-slate-800 border-dashed flex flex-col items-center justify-center text-slate-700 p-4 shadow-inner" style={{ clipPath: 'polygon(15% 0%, 85% 0%, 100% 10%, 100% 90%, 50% 100%, 0% 90%, 0% 10%)' }}>
                                                        <Shield size={64} strokeWidth={1} className="opacity-20 mb-4" />
                                                        <span className="font-black text-lg opacity-40 uppercase tracking-widest">{player.pos}</span>
                                                        <span className="font-bold text-sm opacity-30 mt-2">LOCKED</span>
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Màn hình đăng nhập Dev */}
                        {screen === 'dev_login' && (
                            <div className="flex-1 flex flex-col items-center justify-center animate-fade-in py-12">
                                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
                                    <Lock size={48} className="mx-auto text-cyan-500 mb-6" />
                                    <h2 className="text-2xl font-black text-white mb-2">NHÀ PHÁT TRIỂN</h2>
                                    <p className="text-slate-400 text-sm mb-6">Nhập mã truy cập quản lý hệ thống.</p>
                                    <form onSubmit={handleDevLogin}>
                                        <input 
                                            type="password" 
                                            value={devInput}
                                            onChange={(e) => setDevInput(e.target.value)}
                                            placeholder="Mã Code..."
                                            className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-4 font-mono text-center tracking-widest focus:outline-none focus:border-cyan-500 mb-6 uppercase"
                                        />
                                        <div className="flex gap-4">
                                            <button type="button" onClick={() => setScreen('home')} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">Hủy</button>
                                            <button type="submit" className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition">Truy Cập</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Màn hình Dashboard quản lý Dev */}
                        {screen === 'dev_dashboard' && isDevAuth && (
                            <div className="flex-1 flex flex-col animate-fade-in pb-12">
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-6">
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setScreen('home')} className="bg-slate-900 border border-slate-800 p-3 rounded-xl hover:bg-slate-800 transition">
                                            <ArrowRight size={24} className="transform rotate-180 text-cyan-400" />
                                        </button>
                                        <h2 className="text-2xl font-black text-cyan-400 flex items-center gap-2"><Database size={24}/> DEV DASHBOARD</h2>
                                    </div>
                                    <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        <button onClick={() => setDevTab('questions')} className={`px-6 py-2 rounded-lg font-bold transition ${devTab === 'questions' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'}`}>Kho Đề</button>
                                        <button onClick={() => setDevTab('players')} className={`px-6 py-2 rounded-lg font-bold transition flex items-center gap-2 ${devTab === 'players' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'}`}><Users size={18}/> Kho Cầu Thủ</button>
                                    </div>
                                </div>

                                {devTab === 'questions' && (
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl h-fit">
                                            <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-green-400"><PlusCircle size={20}/> Thêm Đề Toán Mới</h3>
                                            <form onSubmit={handleAddQuestion} className="space-y-4">
                                                <div>
                                                    <label className="text-sm font-bold text-slate-400 block mb-1">Nội dung câu hỏi:</label>
                                                    <textarea required value={newQ.text} onChange={e=>setNewQ({...newQ, text: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-cyan-500 outline-none h-24" placeholder="Nhập đề toán..."></textarea>
                                                </div>
                                                {[0,1,2,3].map(i => (
                                                    <div key={i}>
                                                        <label className="text-sm font-bold text-slate-400 block mb-1">Lựa chọn {i+1}:</label>
                                                        <div className="flex items-center gap-3">
                                                            <input type="radio" name="correctOpt" checked={Number(newQ.correct) === i} onChange={() => setNewQ({...newQ, correct: i})} className="w-5 h-5 accent-cyan-500 cursor-pointer" />
                                                            <input required type="text" value={newQ[`opt${i}`]} onChange={e=>setNewQ({...newQ, [`opt${i}`]: e.target.value})} className={`flex-1 bg-slate-950 border ${Number(newQ.correct) === i ? 'border-cyan-500' : 'border-slate-700'} rounded-lg p-2 text-white outline-none`} placeholder={`Đáp án ${i+1}`} />
                                                        </div>
                                                    </div>
                                                ))}
                                                <button type="submit" className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 mt-4 transition"><Save size={20}/> Lưu Câu Hỏi</button>
                                            </form>
                                        </div>

                                        <div className="lg:col-span-2 space-y-4 h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
                                            <h3 className="text-xl font-bold mb-4 flex justify-between">
                                                <span>Toàn Bộ Đề Trong Kho ({questionBank.length} câu)</span>
                                            </h3>
                                            {questionBank.map((q, i) => (
                                                <div key={q.id} className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex justify-between items-start group">
                                                    <div className="flex-1">
                                                        <div className="font-bold text-lg mb-2 text-white"><span className="text-cyan-500 mr-2">Q{i+1}:</span> {q.text}</div>
                                                        <div className="grid grid-cols-2 gap-2 text-sm">
                                                            {q.options.map((opt, oIdx) => (
                                                                <div key={oIdx} className={`p-2 rounded bg-slate-950 border ${oIdx === q.correct ? 'border-green-500/50 text-green-400 font-bold' : 'border-slate-800 text-slate-400'}`}>
                                                                    {String.fromCharCode(65+oIdx)}. {opt} {oIdx === q.correct && '✓'}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDeleteQuestion(q.id)} className="text-slate-600 hover:text-red-500 ml-4 p-2 opacity-0 group-hover:opacity-100 transition">
                                                        <XCircle size={24} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {devTab === 'players' && (
                                    <div className="space-y-6">
                                        <p className="text-slate-400 text-center">Xem trước toàn bộ giao diện tất cả thẻ cầu thủ có trong hệ thống.</p>
                                        <div className="flex flex-wrap justify-center gap-6 sm:gap-8 pb-12">
                                            {PLAYERS.map(player => (
                                                <PlayerCard key={player.id} player={player} isNew={false} />
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
